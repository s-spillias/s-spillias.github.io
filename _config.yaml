title: "Scott Spillias"
name: "Scott Spillias"
tagline: "AI for Ecosystem Modelling and Environmental Science"
description: "Research scientist at CSIRO (Hobart, Australia) building and testing AI agents and large language models for marine ecosystem modelling and environmental science."
url: "https://s-spillias.github.io"
repository: "s-spillias/s-spillias.github.io"
locale: "en_AU"   # og:locale for link previews
lang: "en-AU"     # <html lang>

# Profiles that refer to the same person; used in search-engine structured data
social:
  name: "Scott Spillias"
  links:
    - "https://scholar.google.com/citations?user=wbnHaIoAAAAJ"
    - "https://orcid.org/0000-0002-1310-5202"
    - "https://github.com/s-spillias"
    - "https://vitaexmachina.substack.com/"
    - "https://marinesocioecology.org/team/scott-spillias/"

twitter:
  card: summary_large_image

# No theme: layouts, includes, CSS and JS live in this repository
# (_layouts/, _includes/, assets/css/site.css, assets/js/).

markdown: kramdown
permalink: /:title/

author:
  name: "Scott Spillias"
  avatar: "/assets/images/profile_crop.jpeg"
  bio: "Research Scientist, CSIRO Environment. I build and test AI tools for marine ecosystem modelling."
  location: "Hobart, Tasmania"
  email: "scott.spillias@csiro.au"
  links:
    - label: "Google Scholar"
      icon: "fa-solid fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=wbnHaIoAAAAJ&hl=en"
    - label: "ORCID"
      icon: "fa-brands fa-orcid"
      url: "https://orcid.org/0000-0002-1310-5202"
    - label: "GitHub"
      icon: "fa-brands fa-github"
      url: "https://github.com/s-spillias"
    - label: "Vita ex machina"
      icon: "fa-solid fa-pen-nib"
      url: "https://vitaexmachina.substack.com/"

collections:
  pages:
    output: true
    permalink: /:title/

defaults:
  - scope:
      path: ""
    values:
      image:                                    # used for link previews
        path: "/assets/images/og-card.jpg"
        width: 1200
        height: 630
  - scope:
      path: ""
      type: pages       # applies to the 'pages' collection
    values:
      layout: page

# Ensure Jekyll processes pages inside _pages/
include: ["_pages"]
exclude: ["README.md", "Gemfile", "Gemfile.lock", "vendor"]

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
