---
layout: default
---
<article class="page{% if page.toc %} page--toc{% endif %}">
  <header class="page-hero">
    <div class="container">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
    </div>
  </header>
  <div class="container page-body">
    <div class="prose" id="main-content">
      {{ content }}
    </div>
    {% if page.toc %}
    <aside class="toc" aria-label="On this page">
      <nav data-toc></nav>
    </aside>
    {% endif %}
  </div>
</article>
