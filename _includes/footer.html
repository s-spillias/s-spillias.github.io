<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__cta">
      <h2>Get in touch</h2>
      <p>If you work on marine ecosystem models or evidence synthesis and would like to collaborate, email me.</p>
      <a class="btn btn--primary" href="mailto:{{ site.author.email }}"><i class="fa-solid fa-envelope" aria-hidden="true"></i> {{ site.author.email }}</a>
    </div>
    <ul class="social">
      {% for l in site.author.links %}
      <li><a href="{{ l.url }}" rel="me noopener"><i class="{{ l.icon }}" aria-hidden="true"></i><span>{{ l.label }}</span></a></li>
      {% endfor %}
    </ul>
    <p class="site-footer__meta">© {{ site.time | date: '%Y' }} {{ site.author.name }} · {{ site.author.location }}</p>
  </div>
</footer>
