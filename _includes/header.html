<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <svg class="wordmark__mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M9 23 L16 9 L23 20 M9 23 L23 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
        <circle cx="16" cy="9" r="3.6" fill="#fbbf24"/>
        <circle cx="9" cy="23" r="3.1" fill="#a3e635"/>
        <circle cx="23" cy="20" r="3.1" fill="#2dd4bf"/>
      </svg>
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
    <div class="site-header__tools">
      <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Switch between light and dark theme">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
      </button>
      <button class="icon-btn nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>
